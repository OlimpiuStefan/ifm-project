<style>
  body {
    font: 15px system-ui;
    margin: 2rem;

  .row {
    box-sizing: border-box;

    width: 160px;

  }
  .needle {
    position: absolute;

    width: 2px;
    height: 80px;
    background: #c1571c;
    transform-origin: bottom center;
  }

<!-- ─── WHEN DOES YOUR SCRIPT RUN? · show these lines, do not type them ───
<script src="app.js"></script>               plain script in head: can run before the DOM below it exists
<script src="app.js" defer></script>         defer: runs after parsing
<script type="module" src="app.js"></script> ⭐ type="module": deferred by default
<script src="app.js" async></script>         async: runs whenever it finishes downloading
     The last line of this file is the third kind. That is why dom.js can
     find #panel without waiting for anything. -->

<h3>Gauge</h3>
<div id="gauge" class="gauge"><div class="needle"></div></div>
